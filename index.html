<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src blob:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#0a6b4b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Text din Ecran</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Unealtă de telefon, o singură coloană: alegi fișiere, vezi progresul, primești contactele. Verde de receptor pe hârtie rece. */
:root{--bg:#f3f6f4;--card:#fff;--fg:#14211b;--mut:#566a60;--line:#d3ddd7;--acc:#0a6b4b;--acc-fg:#fff;--soft:#dff0e8;--warn:#9a4b00;
--disp:"Bricolage Grotesque","Helvetica Neue",sans-serif;--body:"IBM Plex Sans",-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1613;--card:#18211d;--fg:#e8f0ec;--mut:#9db0a6;--line:#2d3a33;--acc:#4cc79a;--acc-fg:#06231a;--soft:#183a2d;--warn:#f0a65c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1613;--card:#18211d;--fg:#e8f0ec;--mut:#9db0a6;--line:#2d3a33;--acc:#4cc79a;--acc-fg:#06231a;--soft:#183a2d;--warn:#f0a65c;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
main{max-width:640px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
h1{font:800 clamp(30px,8vw,42px)/1.05 var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font:600 19px/1.2 var(--disp);margin:0}
p{margin:0}.mut{color:var(--mut);font-size:14px}
.alege{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;text-align:center;min-height:48px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:600 15px var(--body);cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.btn:focus-visible,input:focus-visible,label.btn:focus-within{outline:3px solid var(--acc);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:default}
label.btn input{position:absolute;opacity:0;width:1px;height:1px}
section{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;min-width:0}
.bara{height:8px;border-radius:4px;background:var(--line);overflow:hidden}.bara i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.rand{display:flex;flex-wrap:wrap;gap:8px}.rand .btn{flex:1 1 130px}
ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:left;vertical-align:middle}
th{border-top:0;font-size:12px;color:var(--mut);letter-spacing:.04em;text-transform:uppercase;font-weight:600}
td input[type=text]{width:100%;box-sizing:border-box;min-width:0;border:1px solid transparent;background:transparent;color:var(--fg);font:inherit;padding:5px;border-radius:6px}
td input[type=text]:hover,td input[type=text]:focus{border-color:var(--line)}
td.tel input{font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
td.bif{width:30px}.gol{color:var(--warn)}
#tabel{min-width:1120px}#tabel td input[type=text]{min-width:90px}
img.mini{display:block;width:40px;height:40px;object-fit:cover;border-radius:50%;border:1px solid var(--line)}
.camp{display:grid;gap:4px}.camp label{font:600 14px var(--body)}
.camp input{min-height:44px;box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);font:16px var(--body);padding:8px 10px}
.set{display:grid;gap:4px;padding-top:8px;border-top:1px solid var(--line)}.set:first-child{border-top:0;padding-top:0}
.set input{min-height:40px;box-sizing:border-box;width:100%;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:15px var(--body);padding:6px 10px}
.scrol{overflow-x:auto}
details{display:grid;gap:8px}summary{cursor:pointer}
textarea{width:100%;box-sizing:border-box;min-height:160px;margin-block:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:14px/1.45 var(--mono);padding:10px}
.tag{display:inline-block;background:var(--soft);color:var(--acc);font:600 12px var(--body);padding:2px 8px;border-radius:99px}
@media (prefers-reduced-motion:reduce){.bara i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Text din Ecran</h1>
  <div class="camp">
    <label for="relatie">Relație pentru setul următor</label>
    <input id="relatie" type="text" placeholder="ex. titlul grupului" autocomplete="off">
  </div>
  <div class="alege">
    <label class="btn pri">Alege poze<input id="poze" type="file" accept="image/*" multiple></label>
    <label class="btn pri">Alege filmare<input id="video" type="file" accept="video/*" multiple></label>
  </div>
  <p id="sfat" class="mut">Pentru liste lungi, filmează ecranul din meniul rapid al telefonului, derulează lent și alege filmarea. Pozele și contactele nu pleacă de pe telefon.</p>
  <section id="progres" hidden>
    <h2 id="pTitlu">Se pregătește…</h2>
    <div class="bara"><i id="pBara"></i></div>
    <p id="pText" class="mut"></p>
    <button id="opreste" class="btn" type="button">Oprește</button>
  </section>
  <section id="eroare" hidden><p id="eText" class="gol"></p></section>
  <section id="seturi" hidden>
    <div id="seturiLista" style="display:grid;gap:8px"></div>
  </section>
  <section id="contacte" hidden>
    <h2 id="cTitlu">Contacte</h2>
    <div class="scrol"><table id="tabel"><thead><tr><th></th><th>Poză</th><th>Nume</th><th>Telefon</th><th>Text lângă nume</th><th>Observații</th><th>Relație</th><th>E-mail</th><th>Firmă sau organizație</th></tr></thead><tbody id="cCorp"></tbody></table></div>
    <div class="rand">
      <button id="copTabel" class="btn pri" type="button">Copiază tabelul ca text</button>
      <button id="salvVcf" class="btn" type="button">Salvează în Contacte, cu poze (.vcf)</button>
      <button id="goleste" class="btn" type="button">Golește</button>
    </div>
    <textarea id="rezerva" aria-label="Text de copiat manual" hidden></textarea>
    <details><summary class="mut">Textul brut citit</summary>
      <textarea id="tot" aria-label="Textul brut" spellcheck="false"></textarea>
      <button id="copTot" class="btn" type="button">Copiază textul brut</button>
    </details>
  </section>
</main>
<script src="ocr/tesseract.min.js"></script>
<script src="reguli.js"></script>
<script>
const $=s=>document.getElementById(s);
const stare={contacte:[],seturi:[],set:null,brut:[],oprit:false,lucreaza:false,worker:null};
const RAND_CAMPURI=[['nume','Nume'],['tel','Telefon','tel'],['text','Text lângă nume'],['obs','Observații'],['relatie','Relație'],['mail','E-mail'],['firma','Firmă sau organizație']];
function randContact(c){
  const tr=document.createElement('tr');
  const b=document.createElement('td');b.className='bif';
  const ib=document.createElement('input');ib.type='checkbox';ib.checked=c.pastreaza!==false;ib.setAttribute('aria-label','Păstrează contactul');ib.onchange=()=>c.pastreaza=ib.checked;
  b.append(ib);
  const p=document.createElement('td');
  if(c.poza){const im=document.createElement('img');im.className='mini';im.src=c.poza;im.alt='';p.append(im)}
  tr.append(b,p);
  for(const[k,et,cls]of RAND_CAMPURI){
    const td=document.createElement('td');if(cls)td.className=cls;
    const i=document.createElement('input');i.type='text';i.value=c[k]||'';i.setAttribute('aria-label',et);
    i.oninput=()=>{c[k]=i.value;if(!c.editat)c.editat={};c.editat[k]=true};
    td.append(i);tr.append(td);
  }
  return tr;
}
const infoSet=s=>{const n=stare.contacte.filter(c=>c.set===s.nr).length;return `Set ${s.nr} · ${s.fisiere} ${s.fisiere===1?'fișier':'fișiere'} · ${n} ${n===1?'contact':'contacte'}`};
function deseneaza(){
  $('contacte').hidden=!stare.seturi.length;$('seturi').hidden=!stare.seturi.length;
  const l=$('seturiLista');
  if(l.contains(document.activeElement))stare.seturi.forEach(s=>{const e=$('setInfo'+s.nr);if(e)e.textContent=infoSet(s)});
  else{
    l.textContent='';
    for(const s of stare.seturi){
      const d=document.createElement('div');d.className='set';
      const p=document.createElement('p');p.className='mut';p.id='setInfo'+s.nr;p.textContent=infoSet(s);
      const i=document.createElement('input');i.type='text';i.value=s.relatie;i.placeholder='Relație pentru acest set';i.setAttribute('aria-label','Relația setului '+s.nr);
      i.oninput=()=>{s.relatie=i.value;for(const c of stare.contacte)if(c.set===s.nr&&!(c.editat&&c.editat.relatie))c.relatie=i.value;tabel()};
      d.append(p,i);l.append(d);
    }
  }
  tabel();
  $('tot').value=stare.brut.join('\n');
}
function tabel(){
  const corp=$('cCorp');if(corp.contains(document.activeElement))return;
  corp.textContent='';stare.contacte.forEach(c=>corp.append(randContact(c)));
  const n=stare.contacte.length;$('cTitlu').textContent=n+(n===1?' contact':' contacte');
}
function progres(titlu,f,text){$('progres').hidden=false;if(titlu)$('pTitlu').textContent=titlu;$('pBara').style.width=Math.round(f*100)+'%';if(text!==undefined)$('pText').textContent=text}
function eroare(m){$('eroare').hidden=!m;$('eText').textContent=m||''}
const absolut=p=>new URL(p,location.href).href;
const NR_MOTOARE=(navigator.hardwareConcurrency||2)>=4?2:1,REPORNIRE=200;
const motoare=[];let limbaRon=null;
async function motor(i=0){
  if(motoare[i]&&motoare[i].folosit<REPORNIRE)return motoare[i].w;
  if(motoare[i]){const v=motoare[i].w;motoare[i]=null;await v.terminate().catch(()=>{})}
  if(!limbaRon){
    progres('Se încarcă motorul de citire',0,'Prima dată durează mai mult (circa 6 MB).');
    const r=await fetch('ocr/ron.b64.txt');if(!r.ok)throw new Error('datele de limbă lipsesc');
    const t=atob((await r.text()).trim()),d=new Uint8Array(t.length);for(let k=0;k<t.length;k++)d[k]=t.charCodeAt(k);
    limbaRon=d;
  }
  const w=await Tesseract.createWorker([{code:'ron',data:limbaRon.slice()}],1,{workerPath:absolut('ocr/worker.min.js'),corePath:absolut('ocr/tesseract-core-simd-lstm.wasm.js'),workerBlobURL:false,cacheMethod:'none'});
  motoare[i]={w,folosit:0};
  return w;
}
// Pregătește imaginea: mărește pozele mici, tonuri de gri, inversează modul întunecat.
function pregateste(sursa,w,h,y0=0,y1=h){
  const f=w>900?900/w:w<700?Math.min(2,900/w):1,ih=y1-y0;
  const c=document.createElement('canvas');c.width=Math.round(w*f);c.height=Math.max(1,Math.round(ih*f));
  const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(sursa,0,y0,w,ih,0,0,c.width,c.height);
  const im=x.getImageData(0,0,c.width,c.height),d=im.data;let s=0;
  for(let i=0;i<d.length;i+=4){const g=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i]=d[i+1]=d[i+2]=g;s+=g}
  if(s/(d.length/4)<110)for(let i=0;i<d.length;i+=4){d[i]=d[i+1]=d[i+2]=255-d[i]}
  x.putImageData(im,0,0);return{c,f,off:Math.round(y0*f),H:Math.round(h*f),taiat:y0>0||y1<h};
}
const mediana=v=>{const a=[...v].sort((x,y)=>x-y);return a.length?a[a.length>>1]:0};
// Din cuvinte și poziții refac rândurile ecranului, chiar dacă numele și telefonul au fost citite separat.
function randuri(data){
  const cuv=[];
  for(const b of data.blocks||[])for(const p of b.paragraphs||[])for(const l of p.lines||[])for(const w of l.words||[]){
    const t=(w.text||'').trim();if(t)cuv.push({t,x0:w.bbox.x0,x1:w.bbox.x1,y0:w.bbox.y0,y1:w.bbox.y1,yc:(w.bbox.y0+w.bbox.y1)/2,h:w.bbox.y1-w.bbox.y0});
  }
  const h=mediana(cuv.map(w=>w.h))||20,rs=[];
  cuv.sort((a,b)=>a.yc-b.yc);
  for(const w of cuv){
    const r=rs[rs.length-1];
    if(r&&Math.abs(w.yc-r.yc)<h*.55){r.w.push(w);r.yc=(r.yc*(r.w.length-1)+w.yc)/r.w.length}
    else rs.push({yc:w.yc,w:[w]});
  }
  rs.forEach(r=>r.w.sort((a,b)=>a.x0-b.x0));
  return rs;
}
// Coloana numelor: poziția la care încep cele mai multe rânduri. Ce e la stânga ei e poza de contact, nu text.
function coloana(rs,W){
  const hit=new Map();
  for(const r of rs){
    const v=new Set(r.w.slice(0,3).map(w=>Math.round(w.x0/W*100)).filter(x=>x>=8&&x<=32));
    for(const x of v)for(const k of[x-1,x,x+1])hit.set(k,(hit.get(k)||0)+1);
  }
  let best=0,cnt=0;for(const[k,n]of hit)if(n>cnt||(n===cnt&&k<best)){best=k;cnt=n}
  return cnt>=3?(best-1.5)/100*W:0;
}
async function citeste(pre,i,memo){
  const w=await motor(i);motoare[i].folosit++;
  const blob=await new Promise(r=>pre.c.toBlob(r,'image/png'));
  const {data}=await w.recognize(blob,{},{text:true,blocks:true});
  const W=pre.c.width,H=pre.H,rs=randuri(data);
  // La o bandă decupată, rândul de la margine e tăiat pe jumătate: îl citește cadrul vecin.
  const hr=mediana(rs.flatMap(r=>r.w.map(x=>x.h)))||20;
  const buni=pre.taiat?rs.filter(r=>{const a=Math.min(...r.w.map(x=>x.y0)),b=Math.max(...r.w.map(x=>x.y1));return !(pre.off>0&&a<hr*.8)&&!(pre.off===0&&b>pre.c.height-hr*.8)}):rs;
  let col=coloana(buni,W);
  if(col)memo.col=col/W;else if(memo.col)col=memo.col*W;
  const linii=[];
  for(const r of buni){
    const v=col?r.w.filter(x=>x.x0>=col||x.t==='~'):r.w;
    if(!v.length)continue;
    linii.push({t:v.map(x=>x.t).join(' '),y0:Math.min(...v.map(x=>x.y0))+pre.off,y1:Math.max(...v.map(x=>x.y1))+pre.off});
  }
  const dif=[];for(let k=1;k<linii.length;k++)dif.push(linii[k].y0-linii[k-1].y0);
  const mari=dif.filter(d=>d>H*.03);
  if(mari.length)memo.pas=mediana(mari);
  return{linii,brut:data.text.split('\n').map(l=>l.replace(/\s+/g,' ').trim()).filter(l=>l.length>1),geo:{inaltime:H,pas:memo.pas||H*.09},col,W,H,f:pre.f};
}
// Decupează poza de contact: în stânga numelui, fără fundalul ecranului.
function decupeaza(sursa,c,g){
  if(!g.col||c.y0==null)return '';
  const f=g.f,yc=(c.y0+c.y1)/2/f,raza=g.geo.pas/2/f,X1=Math.floor(g.col/f*.97),Y0=Math.max(0,Math.floor(yc-raza)),Y1=Math.min(Math.round(g.H/f),Math.ceil(yc+raza));
  if(X1<8||Y1-Y0<8)return '';
  const t=document.createElement('canvas');t.width=X1;t.height=Y1-Y0;
  const x=t.getContext('2d',{willReadFrequently:true});x.drawImage(sursa,0,-Y0);
  const d=x.getImageData(0,0,t.width,t.height).data,lat=t.width,fr=[d[0],d[1],d[2]];
  let a=lat,b=t.height,e=-1,s=-1;
  for(let y=0;y<t.height;y++)for(let i=0;i<lat;i++){const o=(y*lat+i)*4;if(Math.abs(d[o]-fr[0])+Math.abs(d[o+1]-fr[1])+Math.abs(d[o+2]-fr[2])>36){if(i<a)a=i;if(i>e)e=i;if(y<b)b=y;if(y>s)s=y}}
  const l=e-a+1,i=s-b+1;
  if(e<0||l<g.W/f*.04||i<g.W/f*.04)return '';
  const q=Math.max(l,i),o=document.createElement('canvas');o.width=o.height=96;const ox=o.getContext('2d');ox.fillStyle='#fff';ox.fillRect(0,0,96,96);
  ox.drawImage(t,a-(q-l)/2,b-(q-i)/2,q,q,0,0,96,96);
  return o.toDataURL('image/jpeg',.82);
}
function adauga(rez,sursa){
  const set=stare.set;
  for(const l of rez.brut)if(!set.vazut.has(l)){set.vazut.add(l);stare.brut.push(l)}
  for(const c of Reguli.parseaza(rez.linii,rez.geo)){
    let v=stare.contacte.find(x=>x.set===set.nr&&Reguli.acelasi(x,c));
    if(!v){
      v={nume:'',tel:'',mail:'',text:'',obs:'',firma:'',pastreaza:true,set:set.nr,relatie:set.relatie,poza:'',voturi:new Map()};
      stare.contacte.push(v);
    }
    const ed=v.editat||{};
    if(c.nume){v.voturi.set(c.nume,(v.voturi.get(c.nume)||0)+1);if(!ed.nume)v.nume=[...v.voturi].sort((a,b)=>b[1]-a[1])[0][0]}
    if(c.tel&&!v.tel&&!ed.tel)v.tel=c.tel;
    if(c.mail&&!v.mail&&!ed.mail)v.mail=c.mail;
    if(c.firma&&!v.firma&&!ed.firma)v.firma=c.firma;
    if(c.text&&!v.text&&!ed.text)v.text=c.text;
    if(c.obs&&!ed.obs&&!v.obs.includes(c.obs))v.obs=v.obs?v.obs+'; '+c.obs:c.obs;
    if(!v.poza)v.poza=decupeaza(sursa,c,rez);
  }
  const acum=Date.now();
  if(!stare.lucreaza||acum-(stare.desenat||0)>1500){stare.desenat=acum;deseneaza()}
}
// Lucrează în paralel, dar rezultatele intră mereu în ordinea cadrelor, deci același fișier dă același rezultat.
function banda(){
  const inCurs=[];let nr=0;
  const scoate=async()=>{const j=inCurs.shift();try{const{rez,sursa,gata}=await j;adauga(rez,sursa);gata&&gata()}catch(e){if(j.gata)j.gata();throw e}};
  return{
    async pune(pre,sursa,gata){
      while(inCurs.length>=NR_MOTOARE)await scoate();
      const i=nr++%NR_MOTOARE,memo=stare.set;
      inCurs.push(citeste(pre,i,memo).then(rez=>({rez,sursa,gata})));
    },
    async termina(){while(inCurs.length)await scoate()}
  };
}
async function poza(f,b){
  const bmp=await createImageBitmap(f);
  await b.pune(pregateste(bmp,bmp.width,bmp.height),bmp,()=>bmp.close());
}
// Amprenta unui cadru, fără bara de sus și de jos: 32 de coloane pe câteva sute de rânduri.
const SUS=.07,JOS=.93;
function amprenta(v,W,H){
  const rows=Math.min(400,Math.round(H*(JOS-SUS)/5)),c=document.createElement('canvas');c.width=32;c.height=rows;
  const x=c.getContext('2d',{willReadFrequently:true});x.imageSmoothingQuality='medium';
  x.drawImage(v,0,H*SUS,W,H*(JOS-SUS),0,0,32,rows);
  const d=x.getImageData(0,0,32,rows).data,o=new Uint8Array(32*rows);
  for(let i=0;i<o.length;i++)o[i]=d[i*4+1];
  return{o,rows};
}
// Cu cât a urcat conținutul între două cadre. Pozitiv: au apărut rânduri noi jos.
function deplasare(a,b){
  const R=a.rows,min=Math.round(R*.25);
  const cost=(dy,lim)=>{
    const n=R-Math.abs(dy),ia=dy>0?dy:0,ib=dy>0?0:-dy;let s=0,c=0;
    for(let y=0;y<n;y+=2){
      const pa=(y+ia)*32,pb=(y+ib)*32;
      for(let x=0;x<32;x++)s+=Math.abs(a.o[pa+x]-b.o[pb+x]);
      c+=32;if(s/c>lim&&c>320)return Infinity;
    }
    return s/c;
  };
  let best=0,bun=cost(0,1e9);const zero=bun;
  for(let dy=1;dy<=R-min;dy++)for(const d of[dy,-dy]){const v=cost(d,bun);if(v<bun-.01){bun=v;best=d}}
  const lat=[];for(let i=0;i<8;i++)lat.push(cost(Math.round((R-min)*(i+1)/9),1e9));
  const tipic=mediana(lat)||1;
  return{dy:best,rows:R,ok:bun<Math.max(1.5,tipic*.45),bun,zero};
}
async function filmare(f,eticheta,b,inregistrare){
  const u=URL.createObjectURL(f),v=document.createElement('video');
  v.muted=true;v.playsInline=true;v.preload='auto';v.src=u;
  const cauta=t=>new Promise(ok=>{v.onseeked=ok;v.currentTime=t});
  try{
    await new Promise((ok,nu)=>{v.onloadeddata=ok;v.onerror=()=>nu(new Error('Telefonul nu poate deschide această filmare.'))});
    const dur=v.duration,W=v.videoWidth,H=v.videoHeight;
    if(!isFinite(dur)||!W)throw new Error('Filmarea nu are o durată citibilă.');
    const PAS=.4,PRAG=.45;
    let ref=null,citite=0;
    // Partea stângă a cadrului rămâne pentru decuparea pozei de contact, după ce filmarea a mers mai departe.
    const instantaneu=()=>{const c=document.createElement('canvas');c.width=Math.round(W*.4);c.height=H;c.getContext('2d').drawImage(v,0,0);return c};
    const citesteCadru=async(am,d)=>{
      let y0=0,y1=H;
      if(d){
        const px=Math.abs(d.dy)/d.rows*H*(JOS-SUS),marja=H*.14;
        if(d.dy>0)y0=Math.max(0,Math.floor(H*JOS-px-marja));else if(d.dy<0)y1=Math.min(H,Math.ceil(H*SUS+px+marja));
      }
      await b.pune(pregateste(v,W,H,y0,y1),instantaneu());
      ref=am;citite++;inregistrare&&inregistrare.push({t:+v.currentTime.toFixed(2),y0,y1,dy:d?d.dy:null});
    };
    const trateaza=async(t,ultim,adanc,tPrec)=>{
      await cauta(t);
      const am=amprenta(v,W,H);
      if(!ref)return citesteCadru(am,null);
      const d=deplasare(ref,am);
      if(d.ok){
        const pr=Math.abs(d.dy)/d.rows;
        if(pr>=PRAG||(ultim&&pr>.02))await citesteCadru(am,d);
        return;
      }
      // Salt prea mare față de ultimul cadru citit: caut un cadru intermediar, ca să nu pierd rânduri.
      if(adanc<3&&t-tPrec>.08){
        const m=(t+tPrec)/2;
        await trateaza(m,false,adanc+1,tPrec);
        await trateaza(t,ultim,adanc+1,m);
        return;
      }
      await citesteCadru(am,null);
    };
    const total=Math.ceil(dur/PAS)+1;let tPrec=0;
    for(let i=0;i<total&&!stare.oprit;i++){
      const ultim=i===total-1,t=ultim?Math.max(0,dur-.05):i*PAS;
      await trateaza(t,ultim,0,tPrec);tPrec=t;
      progres(eticheta,(i+1)/total,`${Math.round(t)} din ${Math.round(dur)} secunde · ${citite} cadre citite · ${stare.contacte.length} contacte`);
    }
  }finally{await b.termina();URL.revokeObjectURL(u)}
}
async function proceseaza(fisiere){
  if(stare.lucreaza||!fisiere.length)return;
  stare.lucreaza=true;stare.oprit=false;eroare('');$('sfat').hidden=true;
  stare.set={nr:stare.seturi.length+1,relatie:$('relatie').value.trim(),fisiere:fisiere.length,vazut:new Set()};
  stare.seturi.push(stare.set);$('relatie').value='';deseneaza();
  let treaza=null;try{treaza=await navigator.wakeLock.request('screen')}catch(e){}
  let rele=0;
  try{
    await motor(0);
    const b=banda();
    for(let i=0;i<fisiere.length&&!stare.oprit;i++){
      const f=fisiere[i],et=`Fișierul ${i+1} din ${fisiere.length}`;
      try{
        if(f.type.startsWith('video/'))await filmare(f,et,b,window.__jurnal);
        else{progres(et,i/fisiere.length,'');await poza(f,b);progres(et,(i+1)/fisiere.length)}
      }catch(e){rele++;console.warn(e)}
    }
    try{await b.termina()}catch(e){rele++;console.warn(e)}
    if(rele)eroare(rele===1?'Un fișier nu a putut fi citit.':rele+' fișiere nu au putut fi citite.');
  }catch(e){
    console.error(e);eroare('Motorul de citire nu a pornit: '+(e&&e.message||e));
  }finally{
    stare.lucreaza=false;$('progres').hidden=true;
    try{treaza&&treaza.release()}catch(e){}
    deseneaza();
  }
}
async function copiaza(t,btn){
  const vechi=btn.textContent;
  try{await navigator.clipboard.writeText(t);btn.textContent='Copiat'}
  catch(e){const z=$('rezerva');z.value=t;z.hidden=false;z.focus();z.select();btn.textContent='Selectat: copiază manual'}
  setTimeout(()=>btn.textContent=vechi,1800);
}
const pastrate=()=>stare.contacte.filter(c=>c.pastreaza);
function salveaza(nume,text,tip){
  const u=URL.createObjectURL(new Blob([text],{type:tip})),a=document.createElement('a');
  a.href=u;a.download=nume;document.body.append(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(u),30000);
}
$('poze').onchange=e=>{const f=[...e.target.files];e.target.value='';proceseaza(f)};
$('video').onchange=e=>{const f=[...e.target.files];e.target.value='';proceseaza(f)};
$('opreste').onclick=()=>{stare.oprit=true;$('pText').textContent='Se oprește după cadrul curent…'};
$('copTabel').onclick=e=>copiaza(Reguli.tabelText(pastrate()),e.target);
$('copTot').onclick=e=>copiaza($('tot').value,e.target);
$('salvVcf').onclick=()=>salveaza('contacte.vcf',Reguli.vcard(pastrate()),'text/vcard');
$('goleste').onclick=()=>{stare.contacte=[];stare.seturi=[];stare.set=null;stare.brut=[];$('rezerva').hidden=true;$('sfat').hidden=false;$('cCorp').textContent='';deseneaza()};
// Aplicația instalată ia singură versiunea nouă, pe același link.
if('serviceWorker'in navigator){
  const aveaControl=!!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(aveaControl&&!stare.lucreaza&&!stare.seturi.length)location.reload()});
  navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(e=>console.warn(e));
}
